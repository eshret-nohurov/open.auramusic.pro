# open.auramusic.pro: share-link pages of Belet Music, proxied to bm-open on 127.0.0.1:3310.
# Goes to /etc/nginx/sites-available/ (plus a symlink in sites-enabled/) or to conf.d/.
# Both are inside the http block, so the zone and cache definitions can stay here.

limit_req_zone $binary_remote_addr zone=bm_open:10m rate=10r/s;
proxy_cache_path /var/cache/nginx/bm-open levels=1:2 keys_zone=bm_open_img:20m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name open.auramusic.pro;

    # Only if DevOps issues the certificate with the http-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://open.auramusic.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name open.auramusic.pro;

    # Paths are placeholders: DevOps provides the certificate.
    ssl_certificate     /etc/letsencrypt/live/open.auramusic.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.auramusic.pro/privkey.pem;

    # No includeSubDomains: other auramusic.pro subdomains are not ours to pin.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req_status 429;

    proxy_set_header Host $host;
    # The site limits click beacons per visitor by this header; without it
    # every visitor would share one limit.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;

    # Association files: no rate limit and no redirects (Apple and Google reject redirects).
    location /.well-known/ { proxy_pass http://127.0.0.1:3310; }
    location = /apple-app-site-association { proxy_pass http://127.0.0.1:3310; }

    # Generated covers, backgrounds, og cards and QR codes. The cache key keeps
    # the query (?v=), so a new cover gets a new entry. The app's Cache-Control
    # wins over proxy_cache_valid: placeholders live 60 s, stale links 5 min.
    location ~ ^/(i|qr)/ {
        limit_req zone=bm_open burst=40 nodelay;
        proxy_cache bm_open_img;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        # add_header here drops the server-level ones, so HSTS is repeated.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Cache $upstream_cache_status;
        # Nothing worth reading in these lines; uncomment to keep the log smaller.
        # access_log off;
        proxy_pass http://127.0.0.1:3310;
    }

    location /static/ {
        # Immutable files with a hash in the name.
        # access_log off;
        proxy_pass http://127.0.0.1:3310;
    }

    location = /e {
        limit_req zone=bm_open burst=10 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:3310;
    }

    # Pages are per visitor (device, language): never cached here.
    location / {
        limit_req zone=bm_open burst=40 nodelay;
        proxy_pass http://127.0.0.1:3310;
    }
}
